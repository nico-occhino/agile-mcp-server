[project]
name = "agile-mcp-server"
version = "0.3.0"
description = "MCP server POC — uncertainty-aware NL2API for hospital management, Agile S.r.l. internship"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastmcp==4.1.3",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "structlog>=24.0",
    "fastapi==0.159.1",
    "uvicorn>=0.30.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.17.1",
    "mypy==2.4.0",
]
eval = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["auth*", "data*", "features*", "workflow*", "orchestrator*", "retrieval*", "rag*", "guardrails*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

