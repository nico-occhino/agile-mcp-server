name: v2 quality

on:
  push:
    branches: [v2/production-hardening]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.6
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Unit and integration tests
        run: uv run --locked pytest -q
      - name: Ruff incremental gate
        run: uv run --locked ruff check --select E4,E7,E9,F workflow/instrumentation.py tests/test_instrumentation_privacy.py v2 tests/test_v2_http_integration.py
      - name: mypy incremental gate
        run: uv run --locked mypy --follow-imports=skip --ignore-missing-imports workflow/instrumentation.py v2
